<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Pick Position</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            border: 2px dashed var(--accent-orange, #ff9f0a);
            box-sizing: border-box;
            overflow: hidden;
            -webkit-app-region: drag;
            /* Allows dragging the whole window */
        }

        .container {
            text-align: center;
            background: #1c1c1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            width: 80%;
        }

        h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #ff9f0a;
        }

        p {
            margin: 0 0 15px;
            font-size: 13px;
            color: #a1a1a6;
        }

        button {
            background: #ff9f0a;
            color: black;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            -webkit-app-region: no-drag;
            /* Make sure the button is clickable and doesn't drag */
        }

        button:hover {
            background: #ffb340;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: none;
            border: none;
            color: #a1a1a6;
            font-size: 18px;
            cursor: pointer;
            padding: 2px 6px;
            width: auto;
            -webkit-app-region: no-drag;
        }

        .close-btn:hover {
            color: white;
            background: none;
        }
    </style>
</head>

<body>
    <div class="container" style="position: relative;">
        <button class="close-btn" id="close-btn" title="Cancel">✕</button>
        <h3>Popup position</h3>
        <p>Drag this window to where you want the popup to appear.</p>
        <button id="save-btn">Save position</button>
    </div>

    <script>
        document.getElementById('save-btn').onclick = () => {
            window.electronAPI.saveCustomPosition();
        };
        document.getElementById('close-btn').onclick = () => {
            window.close();
        };
    </script>
</body>

</html>
