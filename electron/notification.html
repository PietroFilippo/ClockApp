<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            /* Keep in sync with the BrowserWindow backgroundColor in electron/main.js */
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            border: 1px solid #333;
            overflow: hidden;
            user-select: none;
            /* Dragging is handled in JS so tooltips keep working */
            cursor: default;
        }

        .header {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* Room for the close button */
            padding-right: 28px;
            pointer-events: none;
            /* Let clicks pass through to the body for dragging */
        }

        .context,
        h2,
        p {
            pointer-events: auto;
        }

        /* What is ringing, as a phrase: "Alarm set for 07:30", "10:00 timer, 3rd time" */
        .context {
            font-size: 13px;
            line-height: 1.3;
            color: #ff9f0a;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* A finished interval is silent: its context line stays quiet too */
        body.is-interval .context {
            color: #a1a1a6;
        }

        h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 600;
            line-height: 1.25;
            color: #ffffff;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            overflow-wrap: anywhere;
        }

        p {
            margin: 4px 0 0;
            font-size: 13px;
            line-height: 1.3;
            color: #a1a1a6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        p:empty {
            display: none;
        }

        .close-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 28px;
            height: 28px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            border-radius: 6px;
            color: #9a9a9f;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            z-index: 10;
        }

        .close-btn:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .close-btn:focus-visible,
        .actions button:focus-visible {
            outline: 2px solid #ff9f0a;
            outline-offset: 1px;
        }

        .actions {
            flex: 0 0 auto;
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: center;
            pointer-events: auto;
        }

        .actions button {
            flex: 1 1 0;
            min-width: 0;
            max-width: 150px;
            height: 34px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
        }

        .actions button:active {
            opacity: 0.8;
        }

        .actions button:hover {
            filter: brightness(1.1);
        }

        /* Ringing: hot buttons */
        .btn-stop {
            background-color: #ff453a;
            color: white;
        }

        .btn-snooze,
        .btn-repeat {
            background-color: #ff9f0a;
            color: #1a1a1a;
        }

        /* Finished interval: neutral Restart, green Done */
        body.is-interval .btn-repeat {
            background-color: #3a3a3c;
            color: #ffffff;
        }

        body.is-interval .btn-stop {
            background-color: #30d158;
            color: #1a1a1a;
        }
    </style>
</head>

<body>
    <button class="close-btn" id="close" title="Dismiss" aria-label="Dismiss">×</button>

    <div class="header">
        <div class="context" id="context">Alarm</div>
        <h2 id="title">Time is up</h2>
        <p id="message"></p>
    </div>

    <div class="actions">
        <button id="snooze" class="btn-snooze" style="display: none;">Snooze</button>
        <button id="repeat" class="btn-repeat" style="display: none;">Repeat</button>
        <button id="stop" class="btn-stop">Stop</button>
    </div>

    <script>
        // Window drag logic using JS mouse events
        let isDragging = false;
        let startX, startY;

        window.addEventListener('mousedown', (e) => {
            // Drag on left click, unless it's on an action button or the close button
            if (e.button === 0 && !e.target.closest('button')) {
                isDragging = true;
                startX = e.screenX;
                startY = e.screenY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging && window.electronAPI) {
                const deltaX = e.screenX - startX;
                const deltaY = e.screenY - startY;
                window.electronAPI.moveWindow({ deltaX, deltaY });
                startX = e.screenX;
                startY = e.screenY;
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        const params = new URLSearchParams(window.location.search);

        // Helper to truncate text with a tooltip (duplicated from notification.js because
        // this window runs in an isolated context without access to the renderer bundle)
        const truncate = (text, limit) => (text && text.length > limit) ? text.substring(0, limit) + '...' : (text || '');

        const TIMER_DEFAULT_BODY = 'Time is up!';
        const INTERVAL_DEFAULT_BODY = 'All steps completed!';

        // 1 -> "1st", 2 -> "2nd", 3 -> "3rd", 4 -> "4th" ...
        function ordinal(n) {
            const mod100 = n % 100;
            if (mod100 >= 11 && mod100 <= 13) return `${n}th`;
            const suffix = { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th';
            return `${n}${suffix}`;
        }

        function updateContent(data) {
            const title = data.title || '';
            const body = data.body || '';
            const snoozeEnabled = data.snooze === 'true' || data.snooze === true;
            const repeatEnabled = data.repeat === 'true' || data.repeat === true;
            const id = data.id;
            const repeatCount = parseInt(data.repeatCount || '0');
            const isInterval = data.type === 'interval';

            // Titles look like "Alarm (07:30)", "Snooze (07:39)", "Timer Finished" or "Interval Finished":
            // the kind and the time become a context phrase, the label becomes the headline
            const kindMatch = title.match(/^(alarm|snooze|timer)/i);
            const kind = kindMatch ? kindMatch[1].toLowerCase() : '';
            const timeMatch = title.match(/\((.*?)\)/);
            const meta = data.meta || (timeMatch ? timeMatch[1] : '');
            const isTimer = kind === 'timer';

            let context;
            if (isInterval) {
                context = 'Interval finished';
            } else if (kind === 'alarm') {
                context = meta ? `Alarm set for ${meta}` : 'Alarm';
            } else if (kind === 'snooze') {
                context = meta ? `Alarm snoozed to ${meta}` : 'Snoozed alarm';
            } else if (isTimer) {
                context = meta ? `${meta} timer` : 'Timer';
                if (repeatCount > 0) context += `, ${ordinal(repeatCount + 1)} time`;
            } else {
                context = title || 'Notification';
            }
            document.getElementById('context').textContent = context;

            let rawTitle = body || title || 'Notification';
            let rawMessage = '';
            if (isTimer) {
                const hasCustomLabel = body && body !== TIMER_DEFAULT_BODY;
                rawTitle = hasCustomLabel ? body : 'Time is up';
                rawMessage = hasCustomLabel ? 'Time is up' : '';
            } else if (isInterval) {
                const hasPresetName = body && body !== INTERVAL_DEFAULT_BODY;
                rawTitle = hasPresetName ? body : 'All steps completed';
                rawMessage = hasPresetName ? 'All steps completed' : '';
            }

            const titleEl = document.getElementById('title');
            titleEl.textContent = truncate(rawTitle, 60);
            titleEl.title = rawTitle;

            const messageEl = document.getElementById('message');
            messageEl.textContent = rawMessage;
            messageEl.title = rawMessage;

            document.body.classList.toggle('is-interval', isInterval);

            const snoozeBtn = document.getElementById('snooze');
            snoozeBtn.style.display = snoozeEnabled ? 'block' : 'none';
            snoozeBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'snooze', id });
            };

            const repeatBtn = document.getElementById('repeat');
            repeatBtn.textContent = isInterval ? 'Restart' : 'Repeat';
            repeatBtn.style.display = repeatEnabled ? 'block' : 'none';
            repeatBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'repeat', id });
            };

            const stopBtn = document.getElementById('stop');
            stopBtn.textContent = isInterval ? 'Done' : 'Stop';
            stopBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'stop', id });
            };
        }

        // Initialize with the URL parameters
        updateContent({
            title: params.get('title'),
            body: params.get('body'),
            snooze: params.get('snooze'),
            repeat: params.get('repeat'),
            id: params.get('id'),
            repeatCount: params.get('repeatCount'),
            meta: params.get('meta'),
            type: params.get('type')
        });

        // Listen for updates
        if (window.electronAPI && window.electronAPI.onUpdateContent) {
            window.electronAPI.onUpdateContent((data) => {
                updateContent(data);
            });
        }

        document.getElementById('close').onclick = () => {
            window.close();
        };
    </script>
</body>

</html>
