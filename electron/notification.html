<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            border: 1px solid #333;
            overflow: hidden;
            user-select: none;
            /* Manejo do arrastar pelo JS para manter tooltips */
            text-align: center;
            cursor: default;
        }

        .header {
            width: 100%;
            position: relative;
            margin-bottom: 5px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            /* Permite que os cliques passem pelo corpo para arrastar */
        }

        h2,
        p {
            pointer-events: auto;
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 700;
            color: #ff9f1c;
            width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        p {
            margin: 0;
            font-size: 16px;
            color: #cccccc;
            line-height: 1.4;
            width: 100%;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        .close-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 20px;
            padding: 10px;
            line-height: 1;
            z-index: 10;
        }

        .close-btn:hover {
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
            pointer-events: auto;
            box-sizing: border-box;
            justify-content: center;
        }

        button {
            flex: 1;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: opacity 0.2s, transform 0.1s;
            max-width: 140px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-stop {
            background-color: #ff453a;
            color: white;
        }

        .btn-snooze,
        .btn-repeat {
            background-color: #ff9f1c;
            color: #1a1a1a;
        }
    </style>
</head>

<body>
    <button class="close-btn" id="close">×</button>

    <div class="header">
        <h2 id="title">Alarm</h2>
        <p id="message">Time is up!</p>
    </div>

    <div class="actions">
        <button id="snooze" class="btn-snooze" style="display: none;">Snooze</button>
        <button id="repeat" class="btn-repeat" style="display: none;">Repeat</button>
        <button id="stop" class="btn-stop">Stop</button>
    </div>

    <script>
        // Lógica de arrastar janela usando eventos de mouse do JS
        let isDragging = false;
        let startX, startY;

        window.addEventListener('mousedown', (e) => {
            // Arrasta se for clique esquerdo e não sobre botões de ação ou botão de fechar
            if (e.button === 0 && !e.target.closest('button')) {
                isDragging = true;
                startX = e.screenX;
                startY = e.screenY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.screenX - startX;
                const deltaY = e.screenY - startY;
                window.electronAPI.moveWindow({ deltaX, deltaY });
                startX = e.screenX;
                startY = e.screenY;
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        const params = new URLSearchParams(window.location.search);

        // Helper para truncar texto com tooltip (duplicado do notification.js pois
        // essa janela roda em contexto isolado sem acesso ao bundle do renderer)
        const truncate = (text, limit) => (text && text.length > limit) ? text.substring(0, limit) + '...' : (text || '');

        function updateContent(data) {
            const title = data.title;
            const message = data.body;
            const snoozeEnabled = data.snooze === 'true' || data.snooze === true;
            const repeatEnabled = data.repeat === 'true' || data.repeat === true;
            const id = data.id;
            const repeatCount = parseInt(data.repeatCount || '0');

            const countDisplay = (repeatCount > 0) ? ` (${repeatCount + 1}x)` : '';
            const rawTitle = (title || 'Notification') + countDisplay;
            const rawMessage = message || '';

            const displayTitle = truncate(rawTitle, 60);
            const displayMessage = truncate(rawMessage, 60);

            const titleEl = document.getElementById('title');
            titleEl.textContent = displayTitle;
            titleEl.title = rawTitle;

            const messageEl = document.getElementById('message');
            messageEl.textContent = displayMessage;
            messageEl.title = rawMessage;

            const snoozeBtn = document.getElementById('snooze');
            snoozeBtn.style.display = snoozeEnabled ? 'block' : 'none';
            snoozeBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'snooze', id });
            };

            const repeatBtn = document.getElementById('repeat');
            repeatBtn.style.display = repeatEnabled ? 'block' : 'none';
            repeatBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'repeat', id });
            };

            const stopBtn = document.getElementById('stop');
            stopBtn.onclick = () => {
                window.electronAPI.sendNotificationAction({ action: 'stop', id });
            };
        }

        // Inicializa com os parâmetros da URL
        updateContent({
            title: params.get('title'),
            body: params.get('body'),
            snooze: params.get('snooze'),
            repeat: params.get('repeat'),
            id: params.get('id'),
            repeatCount: params.get('repeatCount')
        });

        // Espera por atualizações
        if (window.electronAPI && window.electronAPI.onUpdateContent) {
            window.electronAPI.onUpdateContent((data) => {
                updateContent(data);
            });
        }

        document.getElementById('close').onclick = () => {
            window.close();
        };
    </script>
</body>

</html>
